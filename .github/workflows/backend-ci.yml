name: Backend CI

on:
  push:
    branches: [main, great-rework]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: loreboard_test
          POSTGRES_USER: loreboard
          POSTGRES_PASSWORD: loreboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check src/

      - name: Type check
        working-directory: backend
        run: mypy src/ --ignore-missing-imports --no-error-summary

      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://loreboard:loreboard@localhost:5432/loreboard_test
          DATABASE_URL_SYNC: postgresql+psycopg2://loreboard:loreboard@localhost:5432/loreboard_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ANTHROPIC_API_KEY: test-key-not-used-in-unit-tests
        run: pytest tests/ -v --tb=short
